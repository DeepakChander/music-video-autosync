[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-video-autosync"
version = "0.1.0"
description = "Align music video takes to the master song and build a first-draft Premiere Pro sequence"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
tray = ["pystray>=0.19", "pillow>=10"]
dev = ["pytest>=8", "httpx>=0.27", "opentimelineio>=0.17", "otio-fcp-adapter>=1.0"]
build = ["pyinstaller>=6"]

[project.scripts]
autosync-engine = "engine.cli:main"
autosync-helper = "helper.__main__:main"

[tool.setuptools]
packages = ["engine", "helper", "export", "tools"]
